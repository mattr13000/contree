<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Contrée</title>
  <link rel="icon" type="image/png" href="/playing-cards-64.png">
</head>
<body>

  <div id="screen-nickname" class="screen active">
    <div id="nickname-wrapper">
      <div id="logo-banner">
        <div id="logo-card-stack">
          <div id="logo-deck"></div>
          <div id="logo-jack"></div>
        </div>
        <span id="logo-title">Contrée</span>
      </div>
      <div class="panel">
        <input id="input-nickname" type="text" placeholder="Votre surnom (3-12 caractères)" minlength="3" maxlength="12" autocomplete="off" />
        <button id="btn-enter">Entrer</button>
        <div id="nickname-error" class="error-message"></div>
      </div>
    </div>
  </div>

  <div id="screen-lobby" class="screen">
    <div class="panel">
      <h2 id="lobby-greeting"></h2>
      <button id="btn-create-room">Créer une partie</button>
      <button id="btn-browse-rooms">Rejoindre une partie</button>
      <button id="btn-play-bots">Jouer contre 3 bots</button>
    </div>
  </div>

  <div id="screen-room-list" class="screen">
    <div class="panel wide">
      <h2>Parties disponibles</h2>
      <div id="rooms-container"></div>
      <button id="btn-back-to-lobby" class="secondary">Retour</button>
    </div>
  </div>

  <div id="screen-waiting" class="screen">
    <div class="panel">
      <h2 id="room-title"></h2>
      <div id="player-slots"></div>
      <div class="row">
        <button id="btn-start" class="hidden" disabled>Démarrer</button>
        <button id="btn-leave-room" class="secondary">Quitter</button>
      </div>
    </div>
  </div>

  <div id="game" class="screen"></div>

  <div id="bid-overlay" class="hidden">
    <div id="bid-modal-box">
      <div id="bid-current-info"></div>
      <div class="bid-selector">
        <div id="bid-values"></div>
        <div id="bid-suits"></div>
      </div>
      <div id="bid-actions">
        <button id="btn-pass">Passer</button>
        <button id="btn-bid" disabled>Annoncer</button>
        <button id="btn-contree" class="hidden">Contrée !</button>
        <button id="btn-surcontree" class="hidden">Surcontrée !</button>
      </div>
    </div>
  </div>

  <div id="contrer-modal" class="hidden">
    <div id="contrer-modal-box">
      <div id="contrer-modal-bid"></div>
      <div id="contrer-modal-question"></div>
      <div id="contrer-modal-actions">
        <button id="btn-contrer-oui">Oui</button>
        <button id="btn-contrer-non">Non</button>
      </div>
    </div>
  </div>

  <div id="bid-action-announcement" class="hidden"></div>

  <div id="surcontree-announcement" class="hidden">Surcontré !</div>
  <div id="contree-announcement" class="hidden">Contré !</div>
  <div id="belote-announcement" class="hidden"></div>

  <div id="game-over-modal" class="hidden">
    <div id="game-over-box">
      <div id="game-over-scores"></div>
      <div id="game-over-result"></div>
      <div id="game-over-bar-wrap"><div id="game-over-bar"></div></div>
    </div>
  </div>

  <div id="victory-modal" class="hidden">
    <div id="victory-box">
      <div id="victory-label">Victoire !</div>
      <div id="victory-names"></div>
      <button id="btn-victory-lobby">Retour au lobby</button>
    </div>
  </div>

  <div id="score-panel" class="hidden"></div>
  <button id="score-btn" class="hidden">Score</button>
  <div id="score-modal" class="hidden">
    <div id="score-modal-box">
      <div id="score-modal-content"></div>
      <button id="score-modal-ok">OK</button>
    </div>
  </div>

  <button id="settings-btn" title="Réglages">⚙</button>
  <div id="settings-modal" class="hidden">
    <div id="settings-box">
      <h3>Réglages</h3>

      <div class="settings-row">
        <span class="settings-label">Musique</span>
        <div class="vol-control">
          <button class="vol-btn" data-target="music" data-dir="-1">−</button>
          <span class="vol-value" id="music-vol-value">50%</span>
          <button class="vol-btn" data-target="music" data-dir="1">+</button>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-label">Effets sonores</span>
        <div class="vol-control">
          <button class="vol-btn" data-target="sfx" data-dir="-1">−</button>
          <span class="vol-value" id="sfx-vol-value">50%</span>
          <button class="vol-btn" data-target="sfx" data-dir="1">+</button>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-label">Confirmer chaque carte</span>
        <button id="confirm-toggle" class="settings-toggle">Activé</button>
      </div>

      <button id="settings-surrender" class="settings-danger hidden">Abandonner la partie</button>
      <button id="settings-close" class="secondary">Fermer</button>
    </div>
  </div>

  <!-- Force portrait on phones (landscape mobile UI not built yet) -->
  <div id="rotate-notice">
    <div class="rotate-inner">
      <div class="rotate-glyph">⟳</div>
      <p>Tourne ton téléphone<br>en mode portrait</p>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
